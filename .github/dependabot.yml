version: 2
updates:

  # Maintain dependencies for go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "devel"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "Maintenance"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "devel"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "Maintenance"
    groups:
      github-actions:
        patterns:
          - "*"
